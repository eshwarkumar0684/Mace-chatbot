# Render Blueprint — deploy from repository ROOT (not backend/).
# Dashboard equivalent:
#   Root Directory: (empty)
#   Build Command:  bash render_build.sh
#   Start Command:  bash render_start.sh

services:
  - type: web
    name: mace-chatbot-api
    runtime: python
    plan: free
    buildCommand: bash render_build.sh
    startCommand: bash render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PYTHONPATH
        value: "."
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ALLOW_ALL
        value: "true"
